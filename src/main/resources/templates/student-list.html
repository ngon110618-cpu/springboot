<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AdminLTE 4 | Quản Lý Sinh Viên</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0-beta2/dist/css/adminlte.min.css">
</head>
<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
<div class="app-wrapper">

    <nav class="app-header navbar navbar-expand bg-body">
        <div class="container-fluid">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" data-lte-toggle="sidebar" href="#" role="button"><i class="fa-solid fa-bars"></i></a>
                </li>
                <li class="nav-item d-none d-md-block">
                    <a th:href="@{/admin/students}" class="nav-link fw-bold">Trang Quản Trị Sinh Viên</a>
                </li>
            </ul>
        </div>
    </nav>

    <aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark">
        <div class="sidebar-brand">
            <a th:href="@{/admin/students}" class="brand-link">
                <span class="brand-text fw-light">AdminLTE 4</span>
            </a>
        </div>
        <div class="sidebar-wrapper">
            <nav class="mt-2">
                <ul class="nav sidebar-menu flex-column" data-lte-toggle="treeview" role="menu">
                    <li class="nav-item">
                        <a th:href="@{/admin/students}" class="nav-link active">
                            <i class="nav-icon fa-solid fa-user-graduate"></i>
                            <p>Quản Lý Sinh Viên</p>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </aside>

    <main class="app-main mt-3">
        <div class="app-content-header">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-sm-6">
                        <h3 class="mb-0">Danh Sách Sinh Viên</h3>
                    </div>
                </div>
            </div>
        </div>

        <div class="app-content">
            <div class="container-fluid">

                <!-- Form Thêm / Cập Nhật -->
                <div class="card card-outline mb-4"
                     th:classappend="${editingStudent != null and editingStudent.id != null} ? 'card-warning' : 'card-primary'">
                    <div class="card-header">
                        <h3 class="card-title fw-bold"
                            th:text="${editingStudent != null and editingStudent.id != null} ? 'Cập Nhật Sinh Viên' : 'Thêm Sinh Viên Mới'"></h3>
                    </div>
                    <form th:action="@{/admin/students/save}" th:object="${editingStudent}" method="post">
                        <div class="card-body">
                            <input type="hidden" th:if="${editingStudent != null and editingStudent.id != null}" th:field="*{id}" />

                            <div class="row g-3">
                                <div class="col-md-3">
                                    <label class="form-label fw-bold">Mã SV</label>
                                    <input type="text" th:field="*{masv}" class="form-control" placeholder="VD: SV011" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-bold">Họ và Tên</label>
                                    <input type="text" th:field="*{hoTen}" class="form-control" placeholder="VD: Nguyễn Văn A" required>
                                </div>
                                <div class="col-md-5">
                                    <label class="form-label fw-bold">Email</label>
                                    <input type="email" th:field="*{email}" class="form-control" placeholder="VD: a@gmail.com" required>
                                </div>
                            </div>
                        </div>
                        <div class="card-footer text-end">
                            <button type="submit" class="btn"
                                    th:classappend="${editingStudent != null and editingStudent.id != null} ? 'btn-warning' : 'btn-primary'">
                                <i class="fa-solid fa-save me-1"></i>
                                <span th:text="${editingStudent != null and editingStudent.id != null} ? 'Lưu Cập Nhật' : 'Thêm Mới'"></span>
                            </button>
                            <a th:if="${editingStudent != null and editingStudent.id != null}" th:href="@{/admin/students}" class="btn btn-secondary ms-1">Hủy</a>
                        </div>
                    </form>
                </div>

                <!-- Form Tìm Kiếm (Bổ sung cho Yêu cầu 10) -->
                <div class="card mb-4">
                    <div class="card-body">
                        <form th:action="@{/admin/students}" method="get" class="row g-2 align-items-center">
                            <div class="col-md-5">
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa-solid fa-magnifying-glass"></i></span>
                                    <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Nhập tên hoặc mã sinh viên cần tìm...">
                                </div>
                            </div>
                            <div class="col-auto">
                                <button type="submit" class="btn btn-info text-white"><i class="fa-solid fa-search me-1"></i> Tìm Kiếm</button>
                                <a th:href="@{/admin/students}" class="btn btn-outline-secondary ms-1"><i class="fa-solid fa-rotate-left me-1"></i> Tất Cả</a>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Bảng Dữ Liệu -->
                <div class="card card-dark">
                    <div class="card-header">
                        <h3 class="card-title">Dữ Liệu Hệ Thống</h3>
                    </div>
                    <div class="card-body p-0">
                        <table class="table table-striped align-middle mb-0">
                            <thead>
                            <tr>
                                <th>Mã SV</th>
                                <th>Họ và Tên</th>
                                <th>Email</th>
                                <th>ID (UUID)</th>
                                <th class="text-center" style="width: 150px;">Thao Tác</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="st : ${students}">
                                <td th:text="${st.masv}" class="fw-bold"></td>
                                <td th:text="${st.hoTen}"></td>
                                <td th:text="${st.email}"></td>
                                <td th:text="${st.id}" class="text-muted small"></td>
                                <td class="text-center">
                                    <a th:href="@{/admin/students/edit/{id}(id=${st.id})}" class="btn btn-sm btn-warning">
                                        <i class="fa-solid fa-pen-to-square"></i> Sửa
                                    </a>
                                    <a th:href="@{/admin/students/delete/{id}(id=${st.id})}" class="btn btn-sm btn-danger"
                                       onclick="return confirm('Bạn có chắc chắn muốn xóa?');">
                                        <i class="fa-solid fa-trash"></i> Xóa
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(students)}">
                                <td colspan="5" class="text-center text-muted py-3">Không tìm thấy sinh viên nào phù hợp.</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <footer class="app-footer">
        <div class="float-end d-none d-sm-inline">AdminLTE 4 Template</div>
        <strong>Quản Lý Sinh Viên Spring Boot</strong>
    </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0-beta2/dist/js/adminlte.min.js"></script>
</body>
</html>
